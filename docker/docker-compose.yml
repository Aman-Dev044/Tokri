# Mandi — local infrastructure
# MongoDB runs as a SINGLE-NODE REPLICA SET, not standalone.
# This is mandatory: multi-document transactions do not exist on a standalone
# mongod, and without them the checkout stock-reservation cannot be atomic.

name: mandi

services:
  mongo:
    image: mongo:7.0
    container_name: mandi-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/rs-init.js:/docker-entrypoint-initdb.d/rs-init.js:ro
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy
      # only once a PRIMARY has actually been elected.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: mandi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mandi-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
